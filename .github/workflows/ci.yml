name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Preserve generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 7
