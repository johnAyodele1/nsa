services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nsa
      POSTGRES_USER: nsa
      POSTGRES_PASSWORD: nsa_local_only
    ports:
      - "5432:5432"
    volumes:
      - nsa_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsa -d nsa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nsa_pgdata:
